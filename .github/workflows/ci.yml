name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.22.1"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.3"
      - run: bun install --frozen-lockfile
      - run: bun check
      - run: bun run db:check
      - run: bun run lint
      - run: bun run format:check
      - run: bun run test
      - run: bun run build
      - run: bun run test:integration
      - name: Install Chromium for Spectrum UI smoke
        run: bunx playwright install chromium --with-deps
      - name: Browser smoke (synthetic bookmarks and mocked site icons)
        run: |
          printf 'API_TOKEN=%s\n' "$(openssl rand -hex 48)" > .dev.vars
          chmod 600 .dev.vars
          bun run test:browser
